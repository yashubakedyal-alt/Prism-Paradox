name: Build Prism Paradox Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest.xml
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7309588600605215~2517715953"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('</application>', f'    {meta}\n    </application>')
              open(p, 'w').write(s)
          PY

      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prism-paradox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: prism-paradox-aab
          path: android/app/build/outputs/bundle/release/app-release.aabname: Build Prism Paradox Android APK & AAB

